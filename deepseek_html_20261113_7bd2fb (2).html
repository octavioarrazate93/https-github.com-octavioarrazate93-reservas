<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Reservas · Hotel México</title>
<style>
:root{
  --bg:#faf8f6;
  --bg2:#f3ede8;
  --card:#ffffff;
  --tx:#1f1515;
  --mut:#8a7a72;
  --bd:#e9dfd9;
  --bd2:#d9cbc2;
  --ac:#c8102e;
  --ac-h:#a30d25;
  --ac2:#fdecee;
  --gold:#b8860b;
  --gr:#1e7a45;
  --red:#c8102e;
  --warn:#d97706;
  --sh-sm:0 1px 2px rgba(31,21,21,.05),0 1px 3px rgba(31,21,21,.06);
  --sh:0 2px 4px rgba(31,21,21,.04),0 8px 24px rgba(31,21,21,.08);
  --sh-lg:0 12px 40px rgba(31,21,21,.14);
  --sh-ac:0 8px 24px rgba(200,16,46,.28);
  --r:16px;
  --r-lg:22px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;cursor:pointer}
input:not([type=date]):not([type=month]):not([type=time]),textarea{cursor:text}
body{
  margin:0;
  background:
    radial-gradient(circle at 0% 0%,rgba(200,16,46,.05),transparent 40%),
    radial-gradient(circle at 100% 100%,rgba(184,134,11,.06),transparent 45%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--tx);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased
}
.w{--px:clamp(16px,3vw,44px);max-width:none;margin:0;padding:0 var(--px) 40px}
.cols{display:block}

/* NAV */
.nav{display:flex;gap:8px;margin-bottom:18px;background:var(--card);padding:8px;border-radius:var(--r-lg);box-shadow:var(--sh-sm);border:1px solid var(--bd)}
.nav button{
  flex:1;padding:11px 12px;border-radius:14px;font-weight:600;font-size:14.5px;
  background:transparent;border:1.5px solid transparent;color:var(--mut);
  transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:-.01em
}
.nav button:hover{background:var(--ac2);color:var(--ac)}
.nav button.on{
  background:linear-gradient(135deg,#c8102e,#8f0a20);color:#fff;border-color:transparent;
  box-shadow:var(--sh-ac);font-weight:700
}
.cnt{background:var(--ac);color:#fff;border-radius:99px;padding:1px 8px;font-size:11.5px;margin-left:5px;font-weight:700;font-variant-numeric:tabular-nums}
.nav button.on .cnt{background:rgba(255,255,255,.25);color:#fff}

/* BARS */
.bar{margin:10px 0}
.bl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--mut);font-weight:500}
.bl b{color:var(--tx);font-weight:600}
.bt{height:9px;border-radius:99px;background:var(--ac2);overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#e8455c,#c8102e);transition:width .8s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(200,16,46,.35)}

/* TOTAL CARD */
.tot{
  background:linear-gradient(135deg,#c8102e 0%,#8f0a20 100%);
  color:#fff;border-radius:var(--r-lg);padding:24px;margin-bottom:16px;text-align:center;
  box-shadow:var(--sh-ac);position:relative;overflow:hidden
}
.tot:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.15),transparent 50%);pointer-events:none}
.tot .n{font-size:42px;font-weight:800;margin:4px 0;letter-spacing:-.03em;font-variant-numeric:tabular-nums;position:relative}
.tot .lbl{font-size:13px;opacity:.9;font-weight:500;position:relative}

/* KP */
.kp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kp div{
  background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 12px;
  text-align:center;font-size:11.5px;color:var(--mut);font-weight:500;
  box-shadow:var(--sh-sm);transition:transform .2s,box-shadow .2s
}
.kp div:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kp b{display:block;font-size:21px;color:var(--tx);font-weight:800;margin-bottom:2px;font-variant-numeric:tabular-nums}

@media (max-width:520px){
  .nav{flex-wrap:wrap;padding:6px}
  .nav button{font-size:12.5px;padding:10px 6px;flex:1 1 45%}
}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  border-radius:99px;font-size:12.5px;padding:8px 14px;background:var(--ac2);color:var(--ac);
  border:1.5px solid transparent;font-weight:600;transition:all .18s
}
.chips button:hover{background:var(--ac);color:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(200,16,46,.25)}

/* BUBBLE */
.bub{
  min-height:150px;background:linear-gradient(135deg,#fff9f5,#fdecee);color:#1f1515;
  border:1.5px solid #f0d5d8;border-radius:18px 18px 4px 18px;line-height:1.6
}

/* BUTTONS */
.wbtn{display:inline-block;text-decoration:none;border-radius:13px;transition:transform .15s,box-shadow .15s;font-weight:600}
.wbtn:hover{transform:translateY(-2px) scale(1.02)}
.pri{
  background:linear-gradient(135deg,#c8102e,#8f0a20);color:#fff;border:none;font-weight:700;
  padding:12px 22px;box-shadow:var(--sh-ac);border-radius:13px;font-size:14.5px;
  transition:transform .15s,box-shadow .15s
}
.pri:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 28px rgba(200,16,46,.4)}
.pri:active{transform:scale(.97)}

/* SECTIONS */
.sec{display:none}
.sec.on{display:block;animation:pop .4s cubic-bezier(.4,0,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@media (min-width:900px){#secN .g{grid-template-columns:1fr 1fr 1fr}}

/* HERO */
.hero{
  position:relative;
  height:clamp(360px,58vh,540px);
  background:#fff5f0;
  margin:0 calc(var(--px)*-1) 22px;
  border-radius:0 0 32px 32px;
  overflow:hidden;
  box-shadow:0 16px 48px rgba(200,16,46,.18)
}
.hero:before{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 120%,rgba(200,16,46,.15),transparent 60%),
    linear-gradient(to top,rgba(255,245,240,.75),transparent 40%)
}
.hero .hbg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(24px) brightness(.9) saturate(1.1)}
.hero .hfg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 46%;z-index:0;
  transition:transform 8s ease
}
.hero:hover .hfg{transform:scale(1.04)}
.hero .moon,.hero .pk,.hero .gh{position:absolute;z-index:3;pointer-events:none;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25))}
.hero .moon{top:12px;right:5%;font-size:clamp(30px,5vw,54px);filter:drop-shadow(0 0 16px rgba(255,214,102,.9))}
.hero .pk{bottom:10px;font-size:clamp(28px,4.5vw,48px);animation:bob 2.6s ease-in-out infinite}
.hero .pk1{left:2%}
.hero .pk2{right:2%;animation-delay:-1.2s}
.hero .gh{bottom:36%;right:3%;font-size:clamp(22px,3.5vw,38px);animation:bob 3.4s ease-in-out infinite;opacity:.95}
.hero .spider{position:absolute;z-index:3;top:0;left:12%;font-size:clamp(20px,3vw,30px);transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.hero .spider i{position:absolute;left:50%;bottom:90%;width:1px;height:clamp(30px,8vw,90px);background:rgba(0,0,0,.25)}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* TITLE */
.ttl h1{
  font-family:"Mountains of Christmas",Georgia,serif;font-weight:700;letter-spacing:.5px;
  font-size:clamp(30px,7vw,44px);line-height:1.05;color:#c8102e;margin:0 0 4px;
  text-shadow:0 2px 20px rgba(200,16,46,.15)
}
.ttl p{margin:2px 0 0;font-size:13.5px;color:var(--mut);font-weight:500}
.wave{display:inline-block;animation:wave 2s infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}

/* SUMMARY */
.sum{display:flex;gap:10px;margin-bottom:18px}
.sum div{
  flex:1;border-radius:var(--r);padding:14px 6px;text-align:center;font-size:12px;color:#fff;
  font-weight:600;transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s;cursor:pointer;
  box-shadow:var(--sh);letter-spacing:.01em
}
.sum div:hover{transform:translateY(-4px) scale(1.02)}
.sum div:nth-child(1){background:linear-gradient(135deg,#c8102e,#8f0a20)}
.sum div:nth-child(2){background:linear-gradient(135deg,#1e7a45,#14522e)}
.sum div:nth-child(3){background:linear-gradient(135deg,#b8860b,#8a6508)}
.sum b{display:block;font-size:27px;font-weight:800;margin-bottom:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* CARDS */
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:18px;margin-bottom:16px;box-shadow:var(--sh-sm);transition:box-shadow .25s
}
.card:hover{box-shadow:var(--sh)}

/* FORM GRID */
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g .f{grid-column:1/-1}
label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
input,select,textarea,button{
  font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;
  background:var(--card);color:var(--tx);transition:border-color .2s,box-shadow .2s,transform .12s;
  font-size:14.5px
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac2)}
textarea{min-height:56px;resize:vertical;line-height:1.5}
button{cursor:pointer;width:auto}
button:active{transform:scale(.96)}

/* STEPPER */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.st{display:flex;align-items:center;gap:6px}
.st button{
  width:38px;height:38px;padding:0;border-radius:11px;font-size:19px;background:var(--ac2);
  color:var(--ac);border:1.5px solid transparent;font-weight:700;transition:all .15s;flex-shrink:0
}
.st button:hover{background:var(--ac);color:#fff;transform:translateY(-1px)}
.st input{text-align:center;width:60px;padding:8px;font-weight:600}

/* HAB SELECTOR */
.hb{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1.5px solid var(--bd);border-radius:14px;padding:9px 12px;margin-bottom:7px;
  transition:all .2s;background:var(--card)
}
.hb:hover{border-color:var(--bd2)}
.hb.on{border-color:var(--ac);background:var(--ac2);box-shadow:0 0 0 3px rgba(200,16,46,.08)}

/* RESULT PREVIEW */
.res{
  margin-top:14px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#fdf6f3,#fdecee);
  font-size:13.5px;line-height:1.7;border:1px solid #f0d5d8
}
.res .big{font-size:28px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* MINI BUTTON */
.mini{
  background:var(--card);border:1.5px solid var(--bd);font-size:12px;padding:5px 12px;
  border-radius:99px;color:var(--ac);font-weight:700;transition:all .15s
}
.mini:hover{background:var(--ac);color:#fff;border-color:var(--ac)}

/* TABS */
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--bg2);padding:5px;border-radius:14px}
.tabs button{
  flex:1;padding:8px 4px;border-radius:10px;font-weight:600;font-size:13px;border:none;
  background:transparent;color:var(--mut);transition:all .2s
}
.tabs button:hover{color:var(--ac)}
.tabs button.on{background:var(--card);color:var(--ac);box-shadow:var(--sh-sm);font-weight:700;transform:none}

/* RESERVATION CARDS */
.r{
  border:1px solid var(--bd);border-left:4px solid var(--gr);border-radius:var(--r);
  padding:14px;margin-bottom:12px;background:var(--card);
  animation:pop .4s cubic-bezier(.4,0,.2,1) both;
  transition:transform .2s,box-shadow .2s;
  box-shadow:var(--sh-sm)
}
.r:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.r.hoy{border-left-color:var(--gold);box-shadow:var(--sh-sm),0 0 0 3px rgba(184,134,11,.1)}
.r.pend{border-left-color:var(--warn)}
.r.can{border-left-color:var(--red);opacity:.65}
.r h3{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.m{color:var(--mut);font-size:13px;margin-top:3px;line-height:1.5}
.m b{color:var(--tx);font-weight:700}

/* TAGS */
.tag{
  display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;
  background:var(--ac2);color:var(--ac);margin:6px 4px 0 0;font-weight:700;
  letter-spacing:.01em;border:1px solid transparent
}
.tag.p{color:var(--warn);background:#fef3e2;border-color:#fde0b8}
.tag.c{color:var(--red);background:#fdecee;border-color:#f8c9d0}
.tag.ok{color:var(--gr);background:#e8f5ee;border-color:#c5e8d6}

/* ACTIONS */
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.acts button,.acts a{
  width:auto;padding:7px 13px;font-size:12.5px;border:1.5px solid var(--bd);border-radius:99px;
  background:var(--card);color:var(--tx);text-decoration:none;transition:all .15s;font-weight:600
}
.acts button:hover,.acts a:hover{transform:translateY(-1px);border-color:var(--ac);color:var(--ac);background:var(--ac2)}

/* EMPTY */
.empty{text-align:center;color:var(--mut);padding:34px;font-size:14.5px;font-weight:500}

/* CONFETTI */
.conf{position:fixed;top:-30px;font-size:24px;z-index:99;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg);opacity:.2}}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(31,21,21,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:120;padding:16px}
.modal.s{display:flex}
.mb{
  background:var(--card);border-radius:var(--r-lg);padding:22px;width:100%;max-width:420px;
  animation:pop .3s cubic-bezier(.4,0,.2,1) both;max-height:92vh;overflow:auto;
  box-shadow:var(--sh-lg)
}
.mb h3{margin:0 0 6px;font-size:19px;font-weight:800;letter-spacing:-.01em}

/* ROOM NUMBERS */
.rg{display:flex;flex-wrap:wrap;gap:7px}
.rn{
  width:48px;height:44px;padding:0;border-radius:12px;font-weight:700;border:1.5px solid #c5e8d6;
  background:var(--card);color:var(--gr);display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;transition:all .15s;font-variant-numeric:tabular-nums
}
.rn:hover{border-color:var(--gr);transform:translateY(-1px)}
.rn.oc{background:var(--gold);border-color:var(--gold);color:#fff;cursor:not-allowed;opacity:.9}
.rn.sel{background:linear-gradient(135deg,#c8102e,#8f0a20);border-color:transparent;color:#fff;transform:scale(1.08);box-shadow:0 4px 12px rgba(200,16,46,.3)}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,90px);background:var(--tx);color:#fff;padding:12px 22px;
  border-radius:99px;z-index:100;transition:transform .4s cubic-bezier(.4,0,.2,1);
  font-weight:600;font-size:14px;box-shadow:var(--sh-lg);white-space:nowrap
}
.toast.s{transform:translate(-50%,0)}

/* CHART */
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:12px;padding-top:6px}
.cb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.cb i{
  display:block;width:100%;border-radius:6px 6px 0 0;
  background:linear-gradient(180deg,#e8455c,#c8102e);min-height:2px;transform-origin:bottom;
  animation:grow .8s cubic-bezier(.4,0,.2,1) both;box-shadow:0 -1px 3px rgba(200,16,46,.2)
}
.cb span{font-size:10px;color:var(--mut);height:14px;margin-top:4px;font-weight:600}
.cb b{font-size:10px;margin-bottom:3px;white-space:nowrap;color:var(--tx);font-weight:700}
.m6{gap:10px;height:190px}
.m6 .cb:not(.on) i{opacity:.45}
@keyframes grow{from{transform:scaleY(0)}}

/* PRINT */
.prt{display:none}
@media print{
  .hero,.ttl,.sum,.nav,.noprint,#secN,#secR,#secH,#secW,#secC>.card,.w>.card.row,.w>.m,.toast,.modal,.snow,.santa,#snd{display:none!important}
  html,body{background:#fff!important}
  .w{padding:0!important}
  .prt{display:block;margin-bottom:16px}
  .prt h2{margin:0}
  #secC{display:block!important}
  .card,.kp div{box-shadow:none!important;background:#fff!important;border:1px solid #ccc!important;break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important}
}

/* GLOW EFFECT */
.gx{
  position:fixed;z-index:130;pointer-events:none;line-height:1;transform:translate(-50%,-50%);
  animation:gup 1.5s ease-out forwards;filter:drop-shadow(0 0 8px rgba(255,226,140,.9))
}
@keyframes gup{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 90px)) scale(1.25) rotate(var(--r))}}
@media print{.gx{display:none!important}}

/* SOUND */
#snd{
  position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:14px;z-index:140;
  width:48px;height:48px;padding:0;border-radius:50%;font-size:22px;line-height:1;
  background:var(--card);border:1.5px solid var(--bd);box-shadow:var(--sh);
  transition:transform .15s,box-shadow .15s;color:var(--tx)
}
#snd:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
@media print{#snd{display:none!important}}

/* SNOW */
.snow{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.flake{position:absolute;top:-18px;color:#fff;animation:snowfall linear infinite;text-shadow:0 0 8px rgba(255,255,255,.9);user-select:none}
@keyframes snowfall{to{transform:translate(var(--sx),calc(100vh + 30px)) rotate(200deg)}}

/* LIGHTS */
.hero div.lights{position:absolute;left:0;right:0;top:0;bottom:auto;height:46px;z-index:4;pointer-events:none}
.lights svg{position:absolute;left:0;top:0;width:100%;height:100%}
.bulb{position:absolute;width:11px;height:16px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;transform:translateX(-50%);animation:twk 2.4s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.flake{display:none}.bulb{animation:none}}

/* SANTA */
.santa{
  position:fixed;top:11vh;left:100vw;z-index:61;pointer-events:none;white-space:nowrap;
  font-size:clamp(30px,7vw,60px);line-height:1;filter:drop-shadow(0 0 10px rgba(255,226,140,.8));
  animation:santa 38s linear infinite 3s
}
.santa .bob{display:inline-block;animation:bob2 1.6s ease-in-out infinite}
.santa .rd{letter-spacing:-.1em}
.santa .sg{position:relative;display:inline-block}
.santa .sg b{position:absolute;left:.12em;top:-.5em;font-weight:400;font-size:.8em}
@keyframes santa{0%{transform:translate(0,0)}34%{transform:translate(calc(-100vw - 110%),-4vh)}100%{transform:translate(calc(-100vw - 110%),-4vh)}}
@keyframes bob2{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@media print{.snow,.santa{display:none!important}}
@media (prefers-reduced-motion:reduce){.santa{display:none}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="santa" aria-hidden="true"><span class="bob"><span class="rd">🦌🦌🦌</span><span class="sg"><b>🎅</b>🛷</span></span></div>
