<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Reservas · Hotel México</title>
<style>
:root{--bg:#fff7ef;--card:#fff;--tx:#3a2a22;--mut:#8a7364;--bd:#f0dfd0;--ac:#e2673a;--ac2:#ffe9dc;--gr:#2f9e8f;--red:#d6336c;--warn:#d98e04;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1613;--card:#2a201b;--tx:#f6e9df;--mut:#bfa793;--bd:#3d2f27;--ac:#ff8a5c;--ac2:#3b2418;--gr:#4cd4c3;--red:#ff7aa8;--warn:#ffc247}}
:root[data-theme="dark"]{--bg:#1e1613;--card:#2a201b;--tx:#f6e9df;--mut:#bfa793;--bd:#3d2f27;--ac:#ff8a5c;--ac2:#3b2418;--gr:#4cd4c3;--red:#ff7aa8;--warn:#ffc247}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:15px}
.w{max-width:760px;margin:0 auto;padding:0 14px 30px}
.hero{position:relative;height:210px;margin:0 -14px 14px;border-radius:0 0 30px 30px;overflow:hidden;box-shadow:0 8px 24px rgba(226,103,58,.3)}
.hero img{width:100%;height:100%;object-fit:cover;transition:transform 6s ease}
.hero:hover img{transform:scale(1.12)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(40,15,5,.85),rgba(40,15,5,.05) 65%)}
.hero div{position:absolute;left:18px;bottom:14px;z-index:2;color:#fff}
.hero h1{margin:0;font-size:25px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.hero p{margin:2px 0 0;font-size:13px;opacity:.92}
.wave{display:inline-block;animation:wave 2s infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
.sum{display:flex;gap:8px;margin-bottom:14px}
.sum div{flex:1;border-radius:16px;padding:10px 4px;text-align:center;font-size:12px;color:#fff;transition:transform .2s;cursor:default}
.sum div:hover{transform:translateY(-4px) rotate(-1.5deg)}
.sum div:nth-child(1){background:linear-gradient(135deg,#ff9a5c,#e2673a)}
.sum div:nth-child(2){background:linear-gradient(135deg,#3bb9a8,#2f8f9e)}
.sum div:nth-child(3){background:linear-gradient(135deg,#f06292,#c2185b)}
.sum b{display:block;font-size:26px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g .f{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
input,select,textarea,button{font:inherit;width:100%;padding:9px 10px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);transition:border-color .2s,box-shadow .2s,transform .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac2)}
textarea{min-height:52px;resize:vertical}
button{cursor:pointer;width:auto}
button:active{transform:scale(.94)}
.pri{background:linear-gradient(135deg,#ff8a4c,#e2437a);color:#fff;border:none;font-weight:700;padding:11px 20px;box-shadow:0 6px 16px rgba(226,67,122,.3)}
.pri:hover{transform:translateY(-2px) scale(1.03)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st{display:flex;align-items:center;gap:6px}
.st button{width:36px;height:36px;padding:0;border-radius:50%;font-size:19px;background:var(--ac2);color:var(--ac);border:none;font-weight:700}
.st button:hover{background:var(--ac);color:#fff}
.st input{text-align:center;width:58px}
.hb{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px dashed var(--bd);border-radius:14px;padding:6px 10px;margin-bottom:6px;transition:all .2s}
.hb.on{border:2px solid var(--ac);background:var(--ac2);transform:scale(1.02)}
.res{margin-top:12px;padding:12px;border-radius:16px;background:var(--ac2);font-size:14px;line-height:1.7}
.res .big{font-size:26px;font-weight:800;color:var(--ac)}
.mini{background:var(--bg);border:2px solid var(--bd);font-size:12px;padding:4px 10px;border-radius:99px;color:var(--ac);font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;padding:7px 4px;border-radius:99px;font-weight:600}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.05)}
.r{border:2px solid var(--bd);border-left:7px solid var(--gr);border-radius:18px;padding:12px;margin-bottom:10px;background:var(--card);animation:pop .4s both;transition:transform .2s,box-shadow .2s}
.r:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.1)}
.r.hoy{border-left-color:var(--ac);animation:pop .4s both,pulse 2.2s infinite 1s}
.r.pend{border-left-color:var(--warn)}
.r.can{border-left-color:var(--red);opacity:.7}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--ac2)}}
.r h3{margin:0;font-size:16px}
.m{color:var(--mut);font-size:13px;margin-top:3px}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);margin:4px 4px 0 0;font-weight:700}
.tag.p{color:var(--warn);background:transparent;border:1px solid var(--warn)}
.tag.c{color:var(--red);background:transparent;border:1px solid var(--red)}
.tag.ok{color:var(--gr);background:transparent;border:1px solid var(--gr)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.acts button,.acts a{width:auto;padding:6px 11px;font-size:13px;border:2px solid var(--bd);border-radius:99px;background:var(--bg);color:var(--tx);text-decoration:none;transition:transform .15s}
.acts button:hover,.acts a:hover{transform:translateY(-2px);border-color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:26px;font-size:15px}
.conf{position:fixed;top:-30px;font-size:24px;z-index:99;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg);opacity:.2}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,90px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:100;transition:transform .35s;font-weight:600}
.toast.s{transform:translate(-50%,0)}
</style>
</head>

<script>
var K="reservas_hotel_v1",D=[],edit=null,filtro="prox";
var ROOMS=[["🛏️","Sencilla"],["👑","King size"],["🛌","Doble"],["👨‍👩‍👦","Triple"],["👨‍👩‍👧‍👦","Cuádruple"]];
function $(i){return document.getElementById(i)}
function load(){try{D=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){D=[]}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
var hoy=iso(new Date());
function noches(a,b){var n=Math.round((new Date(b)-new Date(a))/864e5);return n>0?n:1}
function fmt(d){if(!d)return"";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function money(n){return"$"+Number(n||0).toLocaleString("es-MX")}
function total(r){return noches(r.ent,r.sal)*r.tar}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function stp(id,v,m){return'<div class="st"><button type="button" data-t="'+id+'" data-d="-1" data-m="'+m+'">−</button><input id="'+id+'" type="number" min="'+m+'" value="'+v+'"><button type="button" data-t="'+id+'" data-d="1" data-m="'+m+'">+</button></div>'}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button[data-t]");if(!b)return;var i=$(b.dataset.t);i.value=Math.max(+b.dataset.m,(+i.value||0)+ +b.dataset.d);i.dispatchEvent(new Event("input"))});
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("s");setTimeout(function(){e.classList.remove("s")},2200)}
function confeti(){var em=["🎉","✨","🌸","🌴","💛","🧡","⭐"];for(var i=0;i<26;i++){var s=document.createElement("span");s.className="conf";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.setProperty("--dx",(Math.random()*120-60)+"px");s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()},2600,s)}}
function drawHabs(){var h="";ROOMS.forEach(function(x,i){h+='<div class="hb" id="hr'+i+'"><span>'+x[0]+' '+x[1]+'</span>'+stp("hq"+i,0,0)+'</div>'});$("habs").innerHTML=h;ROOMS.forEach(function(x,i){$("hq"+i).oninput=calc})}
function getHabs(){var o={};ROOMS.forEach(function(x,i){var q=+$("hq"+i).value||0;if(q>0)o[x[1]]=q});return o}
function setHabs(o){ROOMS.forEach(function(x,i){$("hq"+i).value=o[x[1]]||0});calc()}
function hn(r){if(!r.habs)return r.hab||"";return Object.keys(r.habs).map(function(k){return(r.habs[k]>1?r.habs[k]+" ":"")+k}).join(", ")}
function anim(el,to){var s=performance.now(),f=function(t){var p=Math.min((t-s)/500,1);el.textContent=money(Math.round(to*p));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function calc(){
 var e=$("ent").value,s=$("sal").value,t=+$("tar").value||0,o=getHabs(),n=(e&&s)?noches(e,s):(+$("noc").value||1);
 if(e&&s)$("noc").value=n;
 ROOMS.forEach(function(x,i){$("hr"+i).classList.toggle("on",!!o[x[1]])});
 var names=hn({habs:o});
 $("res").innerHTML="🛏️ "+(names||"Elige habitación")+"<br>🌙 <b>"+n+"</b> noche"+(n>1?"s":"")+" × "+money(t)+" por noche<br><span class='big' id='rt'></span><br>💰 Para apartar (50%): <b>"+money(n*t/2)+"</b>";
 anim($("rt"),n*t)}
function limpiar(){edit=null;["nom","tel","not","hor","ent","sal"].forEach(function(i){$(i).value=""});$("noc").value=1;$("per").value=2;$("tar").value="";$("ant").value=0;$("ft").textContent="✨ Nueva reserva";$("gu").textContent="Guardar reserva 🎉";$("ca").style.display="none";setHabs({})}
$("ca").onclick=limpiar;
$("mit").onclick=function(){var e=$("ent").value,s=$("sal").value;if(!e||!s||!$("tar").value){toast("Pon fechas y precio primero");return}$("ant").value=Math.round(noches(e,s)*$("tar").value/2)};
$("gu").onclick=function(){
 var n=$("nom").value.trim();if(!n||!$("ent").value||!$("sal").value){alert("Faltan nombre, llegada y salida");return}
 if(!Object.keys(getHabs()).length){alert("Elige al menos una habitación");return}
 if(!(+$("tar").value>0)){alert("Pon el precio por noche");return}
 var r={id:edit||String(Date.now()),nom:n,tel:$("tel").value.trim(),ent:$("ent").value,sal:$("sal").value,hor:$("hor").value,per:+$("per").value||1,habs:getHabs(),tar:+$("tar").value||0,ant:+$("ant").value||0,pag:$("pag").value,not:$("not").value.trim(),est:"activa"};
 if(edit){var i=D.findIndex(function(x){return x.id===edit});r.est=D[i].est;D[i]=r}else D.push(r);
 save();limpiar();render();confeti();toast("¡Reserva guardada! 🎉")};
function digits(t){var d=(t||"").replace(/\D/g,"");if(d.length===10)d="52"+d;return d}
function msgConf(r){return "Hola "+r.nom+", le confirmamos su reservación en Hotel México (Calzada Veracruz 362, Chetumal): llegada "+fmt(r.ent)+(r.hor?" aprox. "+r.hor:"")+", salida "+fmt(r.sal)+", habitación "+hn(r)+" para "+r.per+" persona(s). "+noches(r.ent,r.sal)+" noche(s) a "+money(r.tar)+" por noche, total "+money(total(r))+(r.ant?", anticipo recibido "+money(r.ant)+", saldo "+money(total(r)-r.ant):". Para apartar se requiere el 50% ("+money(total(r)/2)+")")+". Depósito de $200 por llave y control, reembolsable. ¡Lo esperamos!"}
function wa(r,txt){return"https://wa.me/"+digits(r.tel)+"?text="+encodeURIComponent(txt)}
function cuando(r){var d=Math.round((new Date(r.ent)-new Date(hoy))/864e5);return d===0?"¡Llega hoy!":d===1?"Llega mañana":d>1?"Llega en "+d+" días":""}
function render(){
 var q=$("q").value.toLowerCase(),act=D.filter(function(r){return r.est!=="cancelada"});
 $("sHoy").textContent=act.filter(function(r){return r.ent===hoy}).length;
 var s7=new Date();s7.setDate(s7.getDate()+7);s7=iso(s7);
 $("sSem").textContent=act.filter(function(r){return r.ent>=hoy&&r.ent<=s7}).length;
 $("sPend").textContent=act.filter(function(r){return r.sal>=hoy&&r.ant<total(r)/2}).length;
 var L=D.filter(function(r){
  if(q&&(r.nom+r.tel).toLowerCase().indexOf(q)<0)return false;
  if(filtro==="prox")return r.sal>=hoy&&r.est!=="cancelada";
  if(filtro==="hoy")return r.ent<=hoy&&r.sal>=hoy&&r.est!=="cancelada";
  if(filtro==="pas")return r.sal<hoy;
  return true}).sort(function(a,b){return filtro==="pas"?(b.ent>a.ent?1:-1):(a.ent>b.ent?1:-1)});
 var h="";
 L.forEach(function(r,k){
  var t=total(r),sal=t-r.ant,ok=r.ant>=t/2,cl=r.est==="cancelada"?" can":r.ent===hoy?" hoy":ok?"":" pend";
  h+='<div class="r'+cl+'" style="animation-delay:'+Math.min(k*.05,.4)+'s"><h3>'+esc(r.nom)+'</h3>'
  +'<div class="m">📅 '+fmt(r.ent)+' → '+fmt(r.sal)+(r.hor?' · 🕒 '+r.hor:'')+' · 👥 '+r.per+'</div>'
  +'<div class="m">🛏️ '+esc(hn(r))+'</div>'
  +'<div class="m">🌙 '+noches(r.ent,r.sal)+' noche/s × '+money(r.tar)+' = <b>'+money(t)+'</b></div>'
  +'<div class="m">💰 Anticipo '+money(r.ant)+' · Saldo '+money(Math.max(sal,0))+' · '+esc(r.pag)+'</div>'
  +(r.not?'<div class="m">📝 '+esc(r.not)+'</div>':'')
  +'<div>'+(r.est==="cancelada"?'<span class="tag c">Cancelada</span>':(ok?'<span class="tag ok">✅ Apartada</span>':'<span class="tag p">⏳ Falta anticipo</span>'))
  +(r.est==="llegó"?'<span class="tag ok">🧳 Ya llegó</span>':(r.est==="activa"&&cuando(r)?'<span class="tag">'+cuando(r)+'</span>':''))+'</div>'
  +'<div class="acts">'
  +(r.tel?'<a target="_blank" rel="noopener" href="'+wa(r,msgConf(r))+'">💬 Confirmar</a><a target="_blank" rel="noopener" href="'+wa(r,"Hola "+r.nom+", le recordamos su llegada a Hotel México el "+fmt(r.ent)+(r.hor?" a las "+r.hor:"")+". ¡Lo esperamos!")+'">⏰ Recordar</a><a href="tel:'+esc(r.tel)+'">📞</a>':'')
  +'<button onclick="est(\''+r.id+'\',\'llegó\')">✔ Llegó</button>'
  +'<button onclick="ed(\''+r.id+'\')">✏️</button>'
  +(r.est==="cancelada"?'<button onclick="est(\''+r.id+'\',\'activa\')">Reactivar</button>':'<button onclick="est(\''+r.id+'\',\'cancelada\')">Cancelar</button>')
  +'<button onclick="del(\''+r.id+'\')">🗑</button></div></div>'});
 $("lista").innerHTML=h||'<div class="empty">🌴<br>Sin reservas en esta vista</div>'}
function est(id,e){var r=D.find(function(x){return x.id===id});r.est=e;save();render();if(e==="llegó"){confeti();toast("¡Bienvenido huésped! 🧳")}}
function del(id){if(confirm("¿Eliminar esta reserva?")){D=D.filter(function(x){return x.id!==id});save();render()}}
function ed(id){var r=D.find(function(x){return x.id===id});edit=id;$("nom").value=r.nom;$("tel").value=r.tel;$("ent").value=r.ent;$("sal").value=r.sal;$("hor").value=r.hor;$("per").value=r.per;$("tar").value=r.tar;$("ant").value=r.ant;$("pag").value=r.pag;$("not").value=r.not;setHabs(r.habs||{});$("ft").textContent="✏️ Editando reserva";$("gu").textContent="Guardar cambios";$("ca").style.display="";calc();scrollTo({top:0,behavior:"smooth"})}
$("tabs").onclick=function(e){var f=e.target.getAttribute("data-f");if(!f)return;filtro=f;[].forEach.call(this.children,function(b){b.classList.toggle("on",b.getAttribute("data-f")===f)});render()};
$("q").oninput=render;
$("exp").onclick=function(){var t=JSON.stringify(D);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Respaldo copiado 📋")},function(){prompt("Copia el respaldo:",t)})}else prompt("Copia el respaldo:",t)};
$("imp").onclick=function(){var t=prompt("Pega aquí el respaldo:");if(!t)return;try{var a=JSON.parse(t);if(Array.isArray(a)&&confirm("Esto reemplaza las reservas actuales. ¿Continuar?")){D=a;save();render()}}catch(e){alert("Respaldo no válido")}};
$("nocW").innerHTML=stp("noc",1,1);$("perW").innerHTML=stp("per",2,1);
$("noc").oninput=function(){var e=$("ent").value,n=+this.value;if(e&&n>0){var d=new Date(e+"T12:00");d.setDate(d.getDate()+n);$("sal").value=iso(d)}calc()};
["ent","sal","tar"].forEach(function(i){$(i).oninput=calc});
$("ent").onchange=function(){if(!$("sal").value||$("sal").value<=this.value){var d=new Date(this.value+"T12:00");d.setDate(d.getDate()+(+$("noc").value||1));$("sal").value=iso(d)}calc()};
drawHabs();load();render();calc();
</script>
</body>
